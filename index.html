<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vlaardingen Heftrucks – Website in onderhoud</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --orange: #F28C1E;
      --orange-dark: #D4750E;
      --navy: #1A2540;
      --navy-light: #243050;
      --white: #FFFFFF;
      --light-bg: #F4F6FA;
      --text-muted: #8A93A8;
      --border: rgba(255,255,255,0.08);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--navy);
      background-image: url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--white);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Animated background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(242,140,30,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(242,140,30,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Dark overlay over background image ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(20, 30, 55, 0.82);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Top bar ── */
    header {
      position: relative;
      z-index: 10;
      border-bottom: 1px solid #E5E8EF;
      background: #FFFFFF;
      backdrop-filter: blur(10px);
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-logo img {
      height: 72px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    }

    .header-logo-text {
      display: flex;
      flex-direction: column;
    }

    .header-logo-text span:first-child {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--navy);
      line-height: 1.2;
    }

    .header-logo-text span:last-child {
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--orange);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .header-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(242,140,30,0.12);
      border: 1px solid rgba(242,140,30,0.3);
      color: var(--orange);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 50px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .header-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--orange);
      border-radius: 50%;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.75); }
    }

    /* ── Main content ── */
    main {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
    }

    .hero-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 24px rgba(242,140,30,0.35);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-8px); }
    }

    .hero-icon svg {
      width: 30px;
      height: 30px;
      fill: white;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: var(--orange);
    }

    .subtitle {
      font-size: clamp(0.875rem, 1.5vw, 1rem);
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 28px;
      font-weight: 300;
    }

    /* ── Contact card ── */
    .contact-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 48px;
      max-width: 540px;
      width: 100%;
      backdrop-filter: blur(8px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.3);
    }

    .contact-card h2 {
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--orange);
      margin-bottom: 28px;
    }

    .contact-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .contact-list li {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 14px 18px;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .contact-list li:hover {
      background: rgba(242,140,30,0.08);
      border-color: rgba(242,140,30,0.3);
      transform: translateX(4px);
    }

    .contact-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-icon svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    .contact-info {
      text-align: left;
    }

    .contact-info .label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .contact-info a,
    .contact-info span {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--white);
      text-decoration: none;
    }

    .contact-info a:hover {
      color: var(--orange);
    }

    /* ── CTA Button ── */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 15px 32px;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(242,140,30,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(242,140,30,0.5);
    }

    .cta-btn svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    /* ── Progress / divider ── */
    .divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, var(--orange), transparent);
      border-radius: 4px;
      margin: 0 auto 20px;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 10;
      border-top: 1px solid var(--border);
      padding: 20px 40px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    footer strong {
      color: var(--orange);
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header {
        padding: 14px 20px;
      }
      .header-logo img {
        height: 40px;
      }
      .contact-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>

</body>
